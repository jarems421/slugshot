name: Foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install verified Rokit release on temporary runner
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip --output "$RUNNER_TEMP/rokit.zip"
          echo "951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0  $RUNNER_TEMP/rokit.zip" | sha256sum --check
          unzip "$RUNNER_TEMP/rokit.zip" -d "$RUNNER_TEMP/rokit"
          chmod +x "$RUNNER_TEMP/rokit/rokit"
          echo "$RUNNER_TEMP/rokit" >> "$GITHUB_PATH"
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
      - name: Install pinned project tools on temporary runner
        run: rokit install --no-trust-check
      - run: python tools/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-places
          path: build/*.rbxlx
          if-no-files-found: error
