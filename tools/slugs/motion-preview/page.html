<title>Slug motion study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One review room: a dark, neutral stage so the motion is the only thing competing for attention. Three stages side by side, one clock. */
:root{--bg:#101217;--panel:#171a21;--raised:#1c1f27;--line:#303139;--fg:#ece8e2;--muted:#a5a6ab;--accent:#f6a45c;--on-accent:#24170f;--warn:#ffcf70;color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg)}
main{max-width:1540px;margin:auto;padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;justify-content:space-between;gap:20px;align-items:start;flex-wrap:wrap}
header>div{min-width:0;flex:1 1 420px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);margin:0 0 8px;font-weight:700}
h1{font-size:clamp(26px,3vw,40px);letter-spacing:-.03em;margin:0;font-weight:650;line-height:1.12;text-wrap:balance}
.brief{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 0 0;max-width:75ch}
.status{border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:8px 11px;font-size:12px;max-width:34ch;line-height:1.4}
.controls{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.group>span{font-size:12px;color:var(--muted);margin-right:4px}
button{font:inherit;font-size:12px;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button[aria-pressed=true],button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
#speed-note{font-size:12px;color:var(--muted)}
#speed-note.diagnosis{color:var(--warn)}
.studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.studies.focus{grid-template-columns:minmax(0,1fr)}
.studies.focus article:not(.focused){display:none}
.studies.focus .stage{height:min(62vh,620px)}
article{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);min-width:0;display:flex;flex-direction:column}
.stage{height:clamp(240px,30vw,430px);position:relative;background:#14171d;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
canvas{width:100%;height:100%;display:block}
.letter{position:absolute;top:10px;left:12px;font-weight:700;font-size:14px;color:var(--accent)}
.phase{position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums}
.description{padding:12px 14px;display:grid;gap:6px;flex:1;align-content:start}
h2{font-size:15px;margin:0;font-weight:600}
.description p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.solo{justify-self:start;margin-top:4px}
.transport{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timeline{flex:1 1 280px;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
.timeline input{flex:1;min-width:0;accent-color:var(--accent)}
.beats{display:flex;gap:6px;flex-wrap:wrap}
.beats span{color:var(--muted);font-variant-numeric:tabular-nums}
.beats b{font-weight:500}
footer{font-size:12px;color:var(--muted);line-height:1.5;max-width:90ch}
#error{color:var(--warn)}
@media (max-width:820px){.studies{grid-template-columns:minmax(0,1fr)}.stage{height:62vw}}
</style>
<main>
  <header><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="brief" id="brief"></p></div><p class="status" id="status"></p></header>
  <div class="controls">
    <div class="group" role="group" aria-label="Camera"><span>Camera</span><button type="button" data-camera="gameplay">Gameplay</button><button type="button" data-camera="side">Side</button><button type="button" data-camera="front">Front</button><button type="button" data-camera="orbit">Orbit</button></div>
    <div class="group" role="group" aria-label="Playback speed"><span>Speed</span><button type="button" data-speed="0.25">0.25×</button><button type="button" data-speed="0.5">0.5×</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button></div>
    <p id="speed-note"></p>
  </div>
  <section class="studies" aria-label="Compare the motion concepts"></section>
  <section class="transport" aria-label="Playback"><div class="group"><button type="button" id="play" class="primary">Pause</button><button type="button" id="replay">Replay at 1×</button><button type="button" id="compare" hidden>Compare all</button></div><label class="timeline"><span id="time">0.00 s</span><input id="scrub" aria-label="Animation time" type="range" min="0" value="0"></label></section>
  <div class="beats" aria-label="Jump to a beat"></div>
  <footer><p id="note"></p><p>Drag a stage to orbit. Scroll to zoom. Space pauses. All three stages share one clock, camera and light.</p></footer>
  <p id="error" role="alert" hidden></p>
</main>
